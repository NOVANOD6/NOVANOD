<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion & Inscription - Fond Vidéo</title>
  <style>
    /* Reset & Styles de base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
    }

    /* --- CONTENEUR VIDÉO EN ARRIÈRE-PLAN --- */
    .video-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .video-background video {
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    /* Superposition sombre (Overlay) pour garantir la lisibilité du texte */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2;
    }

    /* --- CARTE D'AUTHENTIFICATION (GLASSMORPHISM) --- */
    .auth-card {
      position: relative;
      z-index: 3;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 40px 32px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #ffffff;
    }

    /* Onglets Connexion / Inscription */
    .tab-buttons {
      display: flex;
      justify-content: space-around;
      margin-bottom: 28px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.3s ease, border-bottom 0.3s ease;
      padding-bottom: 8px;
      position: relative;
    }

    .tab-btn.active {
      color: #ffffff;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0;
      width: 100%;
      height: 3px;
      background: #38bdf8;
      border-radius: 2px;
    }

    /* Conteneurs de Formulaires */
    .form-container {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .form-container.active {
      display: flex;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { 
        opacity: 0; 
        transform: translateY(8px); 
      }
      to { 
        opacity: 1; 
        transform: translateY(0); 
      }
    }

    /* Groupes d'entrée (Labels & Inputs) */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .input-group input {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .input-group input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    /* Boutons de Validation */
    .submit-btn {
      margin-top: 10px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    /* Liens pied de formulaire */
    .form-footer {
      text-align: center;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .form-footer a {
      color: #38bdf8;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .form-footer a:hover {
      text-decoration: underline;
    }

    /* Boîte de message personnalisée (Remplacement d'alert) */
    .toast-message {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <!-- Vidéo d'arrière-plan configurée pour a.mp4 -->
  <div class="video-background">
    <video autoplay loop muted playsinline>
      <source src="a.mp4" type="video/mp4">
      Votre navigateur ne prend pas en charge la lecture de vidéo.
    </video>
  </div>

  <!-- Calque sombre par-dessus la vidéo -->
  <div class="video-overlay"></div>

  <!-- Carte d'authentification -->
  <div class="auth-card">
    <div class="tab-buttons">
      <button type="button" class="tab-btn active" id="loginTabBtn" onclick="switchTab('login')">Connexion</button>
      <button type="button" class="tab-btn" id="registerTabBtn" onclick="switchTab('register')">Inscription</button>
    </div>

    <!-- Formulaire de Connexion -->
    <form id="loginForm" class="form-container active" onsubmit="handleSubmit(event, 'Connexion réussie !')">
      <div class="input-group">
        <label for="login-email">Adresse e-mail</label>
        <input type="email" id="login-email" placeholder="votre@email.com" required>
      </div>

      <div class="input-group">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit-btn">Se connecter</button>

      <div class="form-footer">
        <a href="#">Mot de passe oublié ?</a>
      </div>
    </form>

    <!-- Formulaire d'Inscription -->
    <form id="registerForm" class="form-container" onsubmit="handleSubmit(event, 'Inscription réussie !')">
      <div class="input-group">
        <label for="reg-name">Nom complet</label>
        <input type="text" id="reg-name" placeholder="Jean Dupont" required>
      </div>

      <div class="input-group">
        <label for="reg-email">Adresse e-mail</label>
        <input type="email" id="reg-email" placeholder="votre@email.com" required>
      </div>

      <div class="input-group">
        <label for="reg-password">Créer un mot de passe</label>
        <input type="password" id="reg-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="submit-btn">Créer un compte</button>
    </form>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast-message"></div>

  <script>
    // Basculer entre les onglets Connexion et Inscription
    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');

      if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginTabBtn.classList.add('active');
        registerTabBtn.classList.remove('active');
      } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        registerTabBtn.classList.add('active');
        loginTabBtn.classList.remove('active');
      }
    }

    // Gestion des soumissions de formulaires sans rechargement
    function handleSubmit(event, message) {
      event.preventDefault();
      showToast(message);
    }

    // Afficher une notification temporaire
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3000);
    }
  </script>

</body>
</html>
